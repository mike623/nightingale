name: Dev build

on:
  push:
    branches:
      - dev-port

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: dev-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # Dev builds are not published through the updater, so they skip the
      # signed updater artifacts that would require a signing key.
      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        with:
          projectPath: ./client
          args: >-
            --target ${{ matrix.target }}
            --bundles app,dmg
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nightingale-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
